name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever is still running for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          swift --version
          xcodebuild -version
          echo "developer dir: $(xcode-select -p)"

      - name: Test
        run: ./test.sh

      - name: Build the app
        run: ./build.sh
